<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gaffer</title>

    <!-- Phase 3.4 — PWA install. vite-plugin-pwa injects the
         <link rel="manifest"> and its register-sw script automatically at
         build time (see vite.config.ts); theme-color and the Apple-specific
         tags below aren't part of that injection, so they're set here by
         hand. iOS ignores the manifest entirely for "Add to Home Screen"
         and needs its own tags regardless. -->
    <meta name="theme-color" content="#010102" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gaffer" />

    <!-- Type system (index.css's @theme --font-* tokens, per newdesign.md's
         "single voice from display to body" principle): Inter carries every
         weight from headings to body copy — no separate display face.
         JetBrains Mono is reserved for code-like contexts only. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
